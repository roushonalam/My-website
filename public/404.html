<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — EduGenius AI</title>
    <script>
      // Redirect non-hash paths on GitHub Pages cleanly back to HashRouter root
      (function () {
        var path = window.location.pathname;
        var base = path.endsWith('/') ? path : path.replace(/\/[^/]*$/, '/');
        window.location.replace(base + '#/');
      })();
    </script>
  </head>
  <body></body>
</html>
